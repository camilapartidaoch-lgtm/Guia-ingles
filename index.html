<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de estudio de inglés</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<style>
:root{--bg:#f2f5fb;--ink:#14213d;--mute:#56627c;--card:#fff;--line:#d5dcec;--acc:#1b5fe0;--hl:#ffe45c;--ok:#12794a;--okbg:#dff4e8;--bad:#b8322a;--badbg:#fbe3e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1526;--ink:#e7ecf8;--mute:#9aa7c4;--card:#18223a;--line:#2b3858;--acc:#6b9bff;--hl:#7a6a10;--ok:#5fd699;--okbg:#14382a;--bad:#ff8d84;--badbg:#431e1b}}
:root[data-theme="dark"]{--bg:#0e1526;--ink:#e7ecf8;--mute:#9aa7c4;--card:#18223a;--line:#2b3858;--acc:#6b9bff;--hl:#7a6a10;--ok:#5fd699;--okbg:#14382a;--bad:#ff8d84;--badbg:#431e1b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
h2{font:700 21px/1.25 Georgia,serif;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 6px}
.mk{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:14px}
.ex{border-left:4px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0;color:var(--ink)}
.q{padding:12px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.chk{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;min-height:42px}
.opts button.ok,.q.good input{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opts button.no,.q.bad input{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
input{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:min(220px,60%)}
.fb{margin-top:6px;font-size:14px;min-height:1px}
.score{position:sticky;bottom:0;background:var(--acc);color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.score button{background:#fff;color:#14213d;border:0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.donut{width:150px;height:150px;border-radius:50%;margin:8px auto;background:conic-gradient(#e0a100 0 30%,#1b5fe0 30% 55%,#d1495b 55% 75%,#2a9d8f 75% 95%,#8a5cf6 95% 100%);position:relative}
.donut:after{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--card)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:14px}.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}
svg text{fill:var(--ink);font-size:12px}svg .b{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}svg .l{stroke:var(--acc);stroke-width:1}
.tabs{display:flex;gap:8px;margin:0 0 12px}.tabs button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px;font:inherit;font-weight:600;cursor:pointer}.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fc{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 26px/1.3 Georgia,serif;background:var(--bg);border:2px dashed var(--acc);border-radius:14px;padding:18px;margin:6px 0 12px;cursor:pointer}.fc small{font:14px sans-serif;color:var(--mute);margin-top:10px}
.line{min-height:46px;border-bottom:2px dashed var(--line);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px}.line button{border:1.5px solid var(--acc);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.opts button:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.tile{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;cursor:pointer;min-height:112px}.tile .em{font-size:38px;line-height:1.15}.tile b{font-size:14px;line-height:1.25}.tile small{color:var(--mute);font-size:12px;line-height:1.2}
svg .big text{font-size:34px}svg .sm text{font-size:16px}svg .lb text{font-size:14px;font-weight:700}.q .opts+.chk,.line+.opts+.chk{margin-top:10px}
.ic{width:72px;height:72px;background:#eef3ff;border-radius:14px;display:block;margin:0 auto 4px}.tile .ic{width:68px;height:68px}.qi{width:96px;height:96px;margin:0 0 8px}.ic text{font-size:28px;font-weight:700;fill:#14213d}
.bd{background:#eef3ff;border-radius:12px;padding:6px;margin:8px 0}.bd text{fill:#14213d;font-size:16px;font-weight:700}svg .bd text{font-size:16px}
.sel{border-color:var(--acc)!important;background:var(--acc)!important;color:#fff!important}textarea{width:100%;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.tile{min-height:128px}
.tip{border-left:5px solid #f5c542;background:var(--bg);padding:10px 14px;border-radius:8px;margin:14px 0 4px}.tip ul{margin:6px 0 0;padding-left:18px}.tip li{margin:5px 0;font-size:15px}
.ic.bm{width:56px;height:84px}.tile .ic.bm{width:52px;height:78px}.qi.bm{width:80px;height:120px}.fc .ic{width:92px;height:92px}.fc .ic.bm{width:84px;height:126px}.fc .fi{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.st{display:flex;gap:10px;align-items:center;margin:7px 0}.st b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}.st div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}.st i{display:block;color:var(--acc);font-style:normal;font-weight:700}
</style></head><body><main>
<h1>Guía de estudio de inglés</h1>
<p class="sub">Elige un tema: primero lee el resumen y luego practica. Al final hay un examen mixto.</p>
<nav id="nav" aria-label="Temas"></nav>
<div id="view"></div>
</main>
<script>
const body=`<svg viewBox="0 0 320 260" width="100%" role="img" aria-label="Partes del cuerpo"><circle class="b" cx="160" cy="30" r="20"/><path class="b" d="M160 50v12M160 62v70M160 62l-50 30 -8 55M160 62l50 30 8 55M160 132l-30 60 -4 55M160 132l30 60 4 55"/>
<g class="l"><path d="M120 30H70M200 30h50M160 56h-80M160 70h-88M110 92H70M210 92h40M160 100h70M160 126h-80M105 120h-35M140 160h-70M128 192h-58M126 245h-56"/></g>
<text x="40" y="34">ear</text><text x="252" y="34">head</text><text x="38" y="58">neck</text><text x="30" y="72">shoulder</text><text x="40" y="96">arm</text><text x="252" y="96">elbow</text><text x="232" y="104">chest</text><text x="40" y="130">waist</text><text x="6" y="124">wrist</text><text x="32" y="164">thigh</text><text x="36" y="196">knee</text><text x="26" y="249">foot</text></svg>`;
const T=[
{id:"body",t:"Cuerpo y fitness",n:`<h2>Lesson 1 · Vocabulary</h2>${body}<div class="chips"><span>head</span><span>neck</span><span>shoulder</span><span>arm</span><span>elbow</span><span>wrist</span><span>back</span><span>chest</span><span>waist</span><span>leg</span><span>thigh</span><span>knee</span><span>ankle</span><span>foot</span><span>ear</span></div><h3>Gadgets</h3><div class="chips"><span>fitness tracker (brazo/tobillo)</span><span>sports camera</span><span>underwater headphones</span><span>ankle sensor</span></div>`,
q:[["You wear a fitness tracker on your ___.",["wrist","knee","chest"],0],["The part between your head and shoulders is the ___.",["neck","waist","thigh"],0],["The joint in the middle of your arm is the ___.",["ankle","elbow","knee"],1],["The part of your leg above the knee is the ___.","thigh"],["An ankle sensor goes on your ___.",["ankle","wrist","ear"],0],["You use your ___ to hear.","ears|ear"]]},
{id:"can",t:"Can / Can’t",n:`<h2>Grammar · can / can’t (habilidad)</h2><table><tr><th>Afirmativa</th><td>I / you / he / she / we / they <b>can</b> + verbo base</td></tr><tr><th>Negativa</th><td><b>can’t</b> (o cannot) + verbo base</td></tr><tr><th>Pregunta</th><td><b>Can</b> you swim? → Yes, I <b>can</b>. / No, I <b>can’t</b>.</td></tr></table><div class="ex">She can dance. ✔<br>She cans dance. ✘ <span class="mk">nunca “cans”</span><br>He can to swim. ✘ <span class="mk">sin “to”</span></div><p>Can es igual para todas las personas: no lleva -s ni auxiliar “do”.</p>`,
q:[["She ___ dance.",["can","cans","can to"],0],["I ___ play tennis. (negativo)",["can’t","not can","don’t can"],0],["___ you swim?",["Can","Do","Are"],0],["¿Cuál es correcta?",["He can swim.","He cans swim.","He can to swim."],0],["Yes, I ___. (respuesta a Can you swim?)",["can","do","am"],0],["Corrige: He no can’t play tennis.","he can’t play tennis|he can't play tennis|he cannot play tennis"]]},
{id:"adv",t:"Adverbs of manner",n:`<h2>Grammar · adverbs of manner</h2><p>Describen <b>cómo</b> haces una acción y van <span class="mk">después del verbo</span>.</p><table><tr><th>Regla</th><th>Ejemplo</th></tr><tr><td>adjetivo + <b>ly</b></td><td>careful → carefully · quiet → quietly · slow → slowly · gentle → gently</td></tr><tr><td>termina en -y → <b>ily</b></td><td>happy → happily · easy → easily · angry → angrily</td></tr><tr><td>igual al adjetivo</td><td>fast → fast · hard → hard</td></tr><tr><td>irregular</td><td>good → <b>well</b></td></tr></table><div class="ex">I can throw the ball hard.<br>My friend plays it well.</div>`,
q:[["Please drive ___.",["careful","carefully","carefuly"],1],["Todd is a fast runner. He runs ___.",["fast","fastly","good"],0],["She plays the piano ___.",["good","well","goodly"],1],["Adverbs of manner go ___ the main verb.",["after","before"],0],["Please speak ___ in the library.",["quiet","quietly","quietily"],1],["Patti speaks ___ to me sometimes. (angry)","angrily"],["Adverbio de happy:","happily"]]},
{id:"food",t:"Comida y countable",n:`<h2>Vocabulary p. 79 + grammar</h2><div class="chips"><span>spicy = picante</span><span>disgusting = asqueroso</span><span>healthy ↔ unhealthy</span><span>sweet = dulce</span><span>snack = botana</span><span>delicious = delicioso</span></div><table><tr><th>Countable</th><th>Uncountable</th></tr><tr><td>a / an, números, plural (eggs, bananas, empanadas)</td><td>sin a/an, sin plural (milk, rice, meat, water, salt, sugar, flour, bread, cheese, chocolate)</td></tr><tr><td><b>How many</b> eggs…?</td><td><b>How much</b> milk…?</td></tr></table><div class="ex">I like bananas and grapes.<br>Can I have cheese on my pizza?</div>`,
q:[["Has the hot taste of chilies:",["spicy","sweet","healthy"],0],["Tastes very, very bad:",["delicious","disgusting","healthy"],1],["A small amount of food between meals:",["snack","dessert","dish"],0],["How ___ eggs do you want?",["many","much"],0],["How ___ milk do you want?",["much","many"],0],["¿Cuál es uncountable?",["rice","banana","egg"],0],["How many ___ (egg) do you want?","eggs"],["I don’t like ___ (orange).","oranges"],["Opuesto de healthy:","unhealthy"]]},
{id:"groups",t:"Food groups + this/that",n:`<h2>Lesson 2 · Food groups</h2><div class="donut" role="img" aria-label="Gráfica de grupos de alimentos"></div><div class="lg"><div><i style="background:#e0a100"></i>Fruit & veg 30%</div><div><i style="background:#1b5fe0"></i>Carbs 25%</div><div><i style="background:#d1495b"></i>Protein 20%</div><div><i style="background:#2a9d8f"></i>Milk & dairy 20%</div><div><i style="background:#8a5cf6"></i>Fats & sugars 5%</div></div><table><tr><th>Grupo</th><th>Ejemplos</th></tr><tr><td>Protein</td><td>fish, chicken, eggs, beans</td></tr><tr><td>Carbohydrates</td><td>bread, cereal, pasta, rice</td></tr><tr><td>Fruit & veg</td><td>apples, bananas, corn, potatoes</td></tr><tr><td>Milk & dairy</td><td>milk, butter, cheese, yogurt</td></tr><tr><td>Fats & sugars</td><td>oil, chocolate, soda, ice cream</td></tr></table><h2>Grammar · this / that / these / those</h2><table><tr><th></th><th>Cerca</th><th>Lejos</th></tr><tr><th>Singular</th><td><b>this</b></td><td><b>that</b></td></tr><tr><th>Plural</th><td><b>these</b></td><td><b>those</b></td></tr></table><div class="ex">How much is this watermelon? (cerca)<br>Are those apples green? (lejos)</div>`,
q:[["Largest food group in the diagram:",["Fruit and vegetables 30%","Protein 20%","Carbohydrates 25%"],0],["Fats and sugars are ___ of the diagram.",["5%","20%","25%"],0],["Rice and pasta are ___",["Carbohydrates","Protein","Dairy"],0],["Cheese and yogurt are ___",["Milk and Dairy","Protein","Fats and sugars"],0],["___ apples here are fresh. (cerca, plural)",["These","This","Those"],0],["___ table over there is big. (lejos, singular)",["That","This","These"],0],["Can I have ___ one, please? (cerca, singular)","this"],["___ are my shoes over there. (lejos, plural)","those"]]},
{id:"cook",t:"Cooking",n:`<h2>Lesson 3 · Cooking</h2><div class="chips"><span>🔪 knife</span><span>🥒 slice</span><span>🥄 spoon</span><span>🥣 mix</span><span>🥣 bowl</span><span>🍴 fork</span><span>🍞 baking dish</span><span>🔥 bake</span><span>🥛 measuring cup</span><span>➕ add</span></div><h3>Ice cream banana bread</h3><p>Ingredientes: oil, 3 bananas, 1 cup flour, ¼ cup sugar, 2 cups chocolate ice cream. Oven: 175 °C · 1 hour.</p><h3>Los 7 pasos EN ORDEN</h3><table><tr><td>1 🧈</td><td>Put oil on the baking dish.</td></tr><tr><td>2 🔪</td><td>Slice the bananas.</td></tr><tr><td>3 🍌🍦</td><td>Put the bananas and ice cream together in a bowl and mix with a fork.</td></tr><tr><td>4 🥄</td><td>Add the flour and sugar.</td></tr><tr><td>5 🥣</td><td>Mix again with a spoon.</td></tr><tr><td>6 🍞</td><td>Pour the mixture into the baking dish.</td></tr><tr><td>7 🔥</td><td>Bake for one hour.</td></tr></table><p>En tu libro, las instrucciones 1 a 7 llevan: <b>1 f, 2 a, 3 g, 4 b, 5 d, 6 e, 7 c</b>. Todas empiezan con el verbo base (son órdenes).</p>`,
q:[["You use a ___ to cut.",["knife","spoon","bowl"],0],["You use a ___ to measure flour.",["measuring cup","fork","baking dish"],0],["Put the dish in the oven = ___",["bake","slice","add"],0],["Oven temperature in the recipe:",["175 degrees Celsius","1 hour","¼ cup"],0],["The recipe has only ___ ingredients.",["five","ten","three"],0],["You eat with a ___ and a knife.","fork"],["Cut the bananas into pieces: ___ the bananas.","slice"]]},
{id:"verbs",t:"Infinitive / gerund",n:`<h2>Grammar · verb + infinitive or gerund</h2><table><tr><th>Verbo</th><th>Después va…</th></tr><tr><td>want, would like, need, have, plan</td><td><b>to</b> + verbo base<br>I want <b>to visit</b> Europe.</td></tr><tr><td>enjoy</td><td>verbo + <b>-ing</b><br>I enjoy <b>visiting</b> new places.</td></tr><tr><td>like / don’t like</td><td>ambos<br>I like <b>to travel</b> / I like <b>traveling</b>.</td></tr></table><p>Después de <b>would like</b> siempre va infinitivo: I would like <b>to visit</b> a big city.</p><h3>Negativas (del libro)</h3><div class="ex">I would like to visit a big city. / I <b>wouldn’t</b> like to visit a small village.<br>I like traveling by bus. / I <b>don’t</b> like traveling by boat.<br>I enjoy visiting new places. / I <b>don’t</b> enjoy going to places I know.</div><p>El verbo que sigue no cambia aunque la frase sea negativa.</p>`,
q:[["I want ___ Europe.",["to visit","visiting","visit"],0],["I enjoy ___ new places.",["visiting","to visit","visit"],0],["I would like ___ a small village.",["to visit","visiting","visit"],0],["You need ___ virtual tourism.",["to try","trying","try"],0],["After like, we can use…",["infinitive or -ing","only infinitive","only -ing"],0],["They enjoy ___ with virtual tours. (plan)","planning"],["I plan ___ to Italy. (go)","to go"]]},
{id:"tour",t:"Tourism + should/could",n:`<h2>Lesson 2 · Tourism collocations</h2><div class="chips"><span>buy a souvenir</span><span>stay at a hotel</span><span>see the sights</span><span>take a taxi/bus</span><span>take a trip</span><span>take a guided tour</span></div><table><tr><th>Palabra</th><th>Significado</th></tr><tr><td>continent</td><td>área grande de tierra</td></tr><tr><td>sights</td><td>cosas que ves</td></tr><tr><td>sounds</td><td>cosas que oyes</td></tr><tr><td>tour</td><td>viaje por un lugar para ver cosas</td></tr><tr><td>tourist attractions</td><td>lugares que visitan los turistas</td></tr><tr><td>vacation</td><td>viaje para relajarte</td></tr></table><h2>Grammar · should / could</h2><table><tr><th>should + verbo base</th><td>consejo<br>You should pack warm clothes.</td></tr><tr><th>could + verbo base</th><td>posibilidad<br>We could go to China.</td></tr></table>`,
q:[["You ___ pack warm clothes. (consejo)",["should","could","can’t"],0],["We ___ go to India or maybe Italy. (posibilidad)",["could","should","must"],0],["Places tourists visit:",["tourist attractions","sounds","vacation"],0],["Large area of land, e.g., North America:",["continent","tour","sights"],0],["___ a souvenir",["buy","do","make"],0],["stay ___ a hotel","at"],["take a ___ tour","guided"]]}
];
const nav=document.getElementById("nav"),view=document.getElementById("view");
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").trim().replace(/\s+/g," ");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
let cur="body",score={r:0,n:0},answered=new Set();
function draw(){
 nav.innerHTML="";
 [...T,{id:"mix",t:"Examen mixto"}].forEach(x=>{const b=document.createElement("button");b.textContent=x.t;b.setAttribute("aria-pressed",x.id===cur);b.onclick=()=>{cur=x.id;draw();window.scrollTo(0,0)};nav.appendChild(b)});
 score={r:0,n:0};answered=new Set();
 let qs,notes="";
 if(cur==="mix"){const all=T.flatMap(t=>t.q);qs=all.map(a=>[Math.random(),a]).sort((a,b)=>a[0]-b[0]).slice(0,15).map(a=>a[1]);notes=`<div class="card"><h2>Examen mixto</h2><p>15 preguntas al azar de todos los temas. Pulsa “Nuevo examen” para otro intento.</p></div>`}
 else{const t=T.find(x=>x.id===cur);qs=t.q;notes=`<div class="card">${t.n}</div>`}
 view.innerHTML=notes+`<div class="card" id="qs"><h2>Practica</h2></div><div class="score"><span id="sc">0 / ${qs.length}</span><button id="re">Nuevo intento</button></div>`;
 const box=document.getElementById("qs");
 qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML=`<p>${i+1}. ${esc(q[0])}</p><div class="fb"></div>`;
  const fb=d.querySelector(".fb");
  function done(ok,msg){if(answered.has(i))return;answered.add(i);score.n++;if(ok)score.r++;fb.textContent=ok?"✔ Correcto":"✘ "+msg;fb.style.color=ok?"var(--ok)":"var(--bad)";document.getElementById("sc").textContent=score.r+" / "+qs.length+(score.n===qs.length?" · terminado":"");d.classList.add(ok?"good":"bad")}
  if(Array.isArray(q[1])){const o=document.createElement("div");o.className="opts";q[1].forEach((t,j)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{if(answered.has(i))return;b.classList.add(j===q[2]?"ok":"no");if(j!==q[2])o.children[q[2]].classList.add("ok");done(j===q[2],"Respuesta: "+q[1][q[2]])};o.appendChild(b)});d.insertBefore(o,fb)}
  else{const w=document.createElement("div");w.className="opts";const inp=document.createElement("input");inp.placeholder="Escribe tu respuesta";inp.autocapitalize="off";const b=document.createElement("button");b.className="chk";b.textContent="Revisar";const go=()=>{if(!inp.value.trim()||answered.has(i))return;const ans=q[1].split("|").map(norm);done(ans.includes(norm(inp.value)),"Respuesta: "+q[1].split("|")[0])};b.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()};w.append(inp,b);d.insertBefore(w,fb)}
  box.appendChild(d)});
 document.getElementById("re").onclick=draw;
}
draw();

> con sonido de vocal (an egg, an empanada); <b>a</b> con consonante (a banana).", "Errores: “a bread” ✘ → some bread · “How much eggs” ✘ → How many eggs."], "groups": ["Cerca = <b>this / these</b> (como “aquí”). Lejos = <b>that / those</b> (como “allá”).", "Una sola cosa → <b>this / that</b>. Varias → <b>these / those</b>.", "Truco: these y those terminan en <b>e</b> y son los plurales.", "Antes de elegir pregúntate dos cosas: ¿cuántas hay? ¿están cerca o lejos?", "Errores: “this apples” ✘ → these apples · “those table” ✘ → that table.", "En tu libro <b>corn y potatoes</b> van en Fruit & veg, no en Carbs.", "Food groups para memorizar: Fruit & veg 30% · Carbs 25% · Protein 20% · Dairy 20% · Fats & sugars 5%."], "verbs": ["Pregunta clave: ¿es algo que <b>quiero, necesito o planeo</b> (aún no pasa)? Usa <b>to + verbo</b>.", "¿Es algo que <b>disfruto</b> (una actividad)? Usa <b>-ing</b>: enjoy visiting.", "Para memorizar: <b>to</b> → want, would like, need, have, plan. <b>-ing</b> → enjoy. <b>Ambos</b> → like.", "would like siempre lleva to: I would like <b>to visit</b> (no “would like visiting”).", "Errores: “I enjoy to travel” ✘ → I enjoy traveling · “I want going” ✘ → I want to go.", "Truco: <b>to</b> = camino hacia el futuro; <b>-ing</b> = lo estoy disfrutando."], "tour": ["¿Hay una opción claramente mejor? <b>should</b> (consejo). ¿Hay varias opciones posibles? <b>could</b> (posibilidad).", "Pistas: “good idea, important, need to” → should. “maybe, or, one option” → could.", "Los dos van con <b>verbo base</b>, sin to y sin -s: You should pack · He could take.", "Traducción rápida: should = “deberías”; could = “podrías / podríamos”.", "Collocations: casi todo usa <b>take</b> (take a trip, take a taxi, take a guided tour). Los demás: buy a souvenir, stay at a hotel, see the sights.", "Error: “You should to go” ✘ → You should go."]};

const CHEAT=`<div class="card"><h2>Chuleta final</h2><p>Repásala la noche anterior y justo antes del examen.</p><table><tr><th>✔ Bien</th><th>✘ Mal</th></tr><tr><td>She <b>can</b> dance.</td><td>She cans dance / can to dance</td></tr><tr><td>Can you swim? Yes, I <b>can</b>.</td><td>Do you can swim? Yes, I do</td></tr><tr><td>He is a good runner. He runs <b>well</b>.</td><td>He runs good</td></tr><tr><td>Drive <b>carefully</b>. Happy → <b>happily</b>.</td><td>drive careful · happyly</td></tr><tr><td>How <b>many</b> eggs? How <b>much</b> milk?</td><td>How much eggs</td></tr><tr><td><b>these</b> apples · <b>that</b> table</td><td>this apples · those table</td></tr><tr><td>I want <b>to visit</b>. I enjoy <b>visiting</b>.</td><td>I enjoy to visit · I want visiting</td></tr><tr><td>You <b>should pack</b>. We <b>could go</b>.</td><td>You should to pack</td></tr><tr><td><b>foot</b> = pie</td><td>food = comida</td></tr></table><h3>Pistas rápidas</h3><div class="chips"><span>¿Cómo? → adverbio</span><span>número + cosa → countable</span><span>cerca → this/these</span><span>lejos → that/those</span><span>enjoy → -ing</span><span>want/need/plan/have → to</span><span>consejo → should</span><span>posibilidad → could</span></div><h3>Se memoriza tal cual</h3><div class="ex">Food groups: Fruit &amp; veg 30% · Carbs 25% · Protein 20% · Dairy 20% · Fats &amp; sugars 5%<br>Collocations: buy a souvenir · stay at a hotel · see the sights · take a taxi/bus · take a trip · take a guided tour<br>Receta: 175 °C · 1 hora · 5 ingredientes</div></div>`;

body:`<h2>Lesson 1 · Vocabulary</h2>${BODYSVG}`,
adv:`<h2>Grammar · adverbs of manner</h2><p><b>¿Qué es?</b> Una palabra que dice <b>cómo</b> haces una acción. Responde la pregunta <span class="mk">How?</span> (¿cómo?).</p><h3>1. Cómo se escribe: adjetivo → adverbio</h3>${tb(["Regla","Ejemplos"],[["+ <b>ly</b>","careful → <b>carefully</b><br>quiet → <b>quietly</b><br>slow → <b>slowly</b><br>gentle → <b>gently</b>"],["termina en -y: cambia a <b>ily</b>","happy → <b>happily</b><br>easy → <b>easily</b><br>angry → <b>angrily</b>"],["<b>igual</b> que el adjetivo","fast → <b>fast</b><br>hard → <b>hard</b>"],["<b>irregular</b>","good → <b>well</b>"]])}<h3>2. Dónde va: después del verbo</h3>${ex(["I can throw the ball <b>hard</b>.","You have to play <b>fast</b>.","My friend plays it <b>well</b>.","I can kick it <b>easily</b>.","You have to kick the ball <b>gently</b>."])}<h3>3. Adjetivo o adverbio</h3>${tb(["Adjetivo (describe una persona o cosa)","Adverbio (describe una acción)"],[["Fernando is a <b>slow</b> swimmer.","Fernando swims <b>slowly</b>."],["Todd is a <b>fast</b> runner.","Todd runs <b>fast</b>."],["She is a <b>good</b> singer.","She sings <b>well</b>."],["Be <b>careful</b>.","Drive <b>carefully</b>."]])}<h3>4. Frases correctas del libro</h3>${ex(["Please drive <b>carefully</b>.","Please speak <b>quietly</b> in the library.","Patti speaks <b>angrily</b> to me sometimes.","I can’t cook Italian food <b>well</b>."])}`,
food:`<h2>Vocabulary + Countable / Uncountable</h2><h3>Adjetivos de comida</h3>${tl([["chili","spicy","picante"],["disgust","disgusting","asqueroso"],["salad","healthy","saludable"],["burger","unhealthy","no saludable"],["candy","sweet","dulce"],["popcorn","snack","botana"],["yum","delicious","delicioso"]])}<h3>✔ COUNTABLE: los puedes contar (1, 2, 3…)</h3>${tl([["egg","an egg","eggs"],["banana","a banana","bananas"],["apple","an apple","apples"],["empanada","an empanada","empanadas"]])}<h3>✘ UNCOUNTABLE: no los cuentas</h3>${tl([["milk","milk","sin plural"],["rice","rice","sin plural"],["bread","bread","sin plural"],["cheese","cheese","sin plural"],["flour","flour","sin plural"],["chocolate","chocolate","sin plural"]])}<p>También incontables: water, salt, sugar, meat, soup, spaghetti.</p><h3>Comparación rápida</h3>${tb(["","Countable","Uncountable"],[["a / an","an egg ✔","a milk ✘"],["números","two eggs ✔","two milks ✘"],["plural","eggs","no hay plural"],["pregunta","How <b>many</b> eggs?","How <b>much</b> milk?"]])}<p><span class="mk">Truco:</span> pregúntate “¿puedo decir two ___?”. Si sí, es countable.</p>${ex(["How much milk do you want in your coffee?","I like bananas and grapes.","Can I have cheese on my pizza?","How many eggs do you want?"])}`,
groups:`<h2>Lesson 2 · Food groups</h2>${oldG.slice(oldG.indexOf('<div class="donut"'),oldG.indexOf("<table>"))}${gc("#d1495b","Protein 20%",[["fish","fish"],["chicken","chicken"],["egg","eggs"]],"También: beans")}${gc("#1b5fe0","Carbohydrates 25%",[["bread","bread"],["pasta","pasta"],["rice","rice"]],"También: cereal")}${gc("#e0a100","Fruit & vegetables 30%",[["apple","apples"],["banana","bananas"],["potato","potatoes"]],"También: corn")}${gc("#2a9d8f","Milk & dairy 20%",[["milk","milk"],["cheese","cheese"]],"También: butter, yogurt")}${gc("#8a5cf6","Fats & sugars 5%",[["oil","oil"],["chocolate","chocolate"],["soda","soda"],["icecream","ice cream"]],"")}<h2>Grammar · this / that / these / those</h2><p>Toca cada palabra y mira la escena:</p><div class="opts"><button class="chk twb" data-w="this" onclick="TW('this')">this</button><button class="chk twb" data-w="that" onclick="TW('that')">that</button><button class="chk twb" data-w="these" onclick="TW('these')">these</button><button class="chk twb" data-w="those" onclick="TW('those')">those</button></div><div id="twv" class="bd" style="min-height:130px">Toca una palabra 👆</div>${tb(["","Cerca","Lejos"],[["1 cosa (singular)","<b>this</b>","<b>that</b>"],["varias (plural)","<b>these</b>","<b>those</b>"]])}${ex(["How much is <b>this</b> watermelon?","Do you want <b>those</b> green ones?","Can we sit at <b>that</b> table, please?","Can I have <b>these</b> apples, please?"])}`,
cook:`<h2>Lesson 3 · Cooking vocabulary</h2>${tl(G.cook)}`,
verbs:`<h2>Grammar · verb + infinitive or gerund</h2><p>Después de algunos verbos, el segundo verbo cambia. Solo hay <b>3 grupos</b>:</p><div class="st"><b style="background:#1b5fe0">to</b><div><i>Grupo 1 · verbo + to + verbo base</i>want · would like · need · have · plan</div></div><div class="st"><b style="background:#12794a">ing</b><div><i>Grupo 2 · verbo + verbo con -ing</i>enjoy</div></div><div class="st"><b style="background:#d9822b">2</b><div><i>Grupo 3 · sirven los dos</i>like</div></div><h3>Lista para aprender</h3>${tb(["Verbo","Significa","Ejemplo"],[["want","querer","I want <b>to visit</b> Europe."],["would like","me gustaría","I would like <b>to visit</b> a big city."],["need","necesitar","You need <b>to try</b> virtual tourism."],["have","tener que","I don’t have <b>to work</b> on Monday."],["plan","planear","I plan <b>to go</b> to Italy."],["enjoy","disfrutar","I enjoy <b>visiting</b> new places."],["like","gustar","I like <b>to travel</b> / I like <b>traveling</b>."]])}<h3>Cómo se forma el -ing</h3>${tb(["Regla","Ejemplo"],[["normal: + ing","visit → visiting · go → going"],["termina en e: quita la e","save → saving · take → taking"],["doble letra","plan → planning · swim → swimming"]])}<h3>Negativo y pregunta</h3>${ex(["I <b>don’t</b> want to go. · I <b>don’t</b> enjoy going to places I know.","I <b>wouldn’t</b> like to visit a small village.","<b>Would you like</b> to visit another continent?","<b>Do you enjoy</b> traveling?"])}<p>El segundo verbo <b>no cambia</b> aunque la frase sea negativa.</p><h3>Frases del libro (Reading B)</h3>${ex(["Would you like <b>to visit</b> another continent?","If you want <b>to save</b> time and money, here’s a tip.","You need <b>to try</b> virtual tourism!","Many people enjoy <b>traveling</b> more.","They like <b>spending</b> time on things that interest them."])}<p><span class="mk">Recuerda:</span> <b>to</b> = algo que quiero, necesito o planeo (todavía no pasa). <b>-ing</b> = algo que disfruto.</p>`,
tour:`<h2>Lesson 1 · Vocabulary</h2>${tb(["Palabra","Significado"],[["continent","área grande de tierra (North America)"],["sights","cosas que ves"],["sounds","cosas que oyes"],["tour","viaje por un lugar para ver cosas interesantes"],["tourist attractions","lugares que visitan los turistas"],["vacation","viaje a otro lugar, para relajarte"]])}<h2>Lesson 2 · Tourism collocations</h2>${tb(["En inglés","Significa"],[["buy a souvenir","comprar un recuerdo"],["stay at a hotel","hospedarse en un hotel"],["see the sights","ver los lugares"],["take a taxi / bus","tomar un taxi / bus"],["take a trip","hacer un viaje"],["take a guided tour","hacer un tour guiado"]])}<p>Casi todos usan <b>take</b>; los otros: buy, stay at, see.</p><h2>Grammar · should / could</h2><p>Los dos van con <b>verbo base</b> (sin to, sin -s).</p>${tb(["","should","could"],[["Para…","consejo (lo importante)","posibilidad (se puede)"],["Significa","deberías","podrías / podríamos"],["Pistas","need, important, good idea","maybe, or, one option"],["Ejemplo","You <b>should pack</b> warm clothes.","We <b>could go</b> to China."]])}<h3>Del libro</h3>${ex(["Tourists are good for the economy. We <b>should</b> welcome them.","We <b>could</b> get more tourists by opening more hotels.","You need to rest. You <b>should go</b> on vacation.","Maybe Alex <b>could take</b> a bus downtown."])}<h3>Misma situación, distinta idea</h3>${ex(["You <b>should</b> take a taxi. (es lo mejor)","You <b>could</b> take a taxi or a bus. (hay opciones)"])}<p>Para sugerir: <b>You could</b> take a virtual tour. / <b>Why don’t you</b> take a virtual tour?</p>`};
